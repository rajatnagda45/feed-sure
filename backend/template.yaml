AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FeedSure CBG v3 operational backend

Parameters:
  Stage:
    Type: String
    Default: dev
  ApiName:
    Type: String
    Default: feedsure-dev-api
  GeneratorsTableName:
    Type: String
    Default: feedsure-dev-Generators
  HistoryTableName:
    Type: String
    Default: feedsure-dev-History
  SubmissionsTableName:
    Type: String
    Default: feedsure-dev-Submissions
  PlansTableName:
    Type: String
    Default: feedsure-dev-Plans
  PhotosBucketName:
    Type: String
    Default: feedsure-dev-photos-change-me
  UploadMinBytes:
    Type: Number
    Default: 1024
  UploadMaxBytes:
    Type: Number
    Default: 3500000
  UploadExpirySeconds:
    Type: Number
    Default: 300
  PhotoRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
  PhotoMaxDimension:
    Type: Number
    Default: 8192
  PhotoMaxPixels:
    Type: Number
    Default: 16000000
  PhotoMaxDecodedBytes:
    Type: Number
    Default: 40000000
  BedrockMaxTokens:
    Type: Number
    Default: 600
  PhotoMinConfidence:
    Type: Number
    Default: 0.6
  AdminToken:
    Type: String
    Default: CHANGE_ME
    NoEcho: true
  PlantOwnerToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Distinct intake-only credential for the CBG plant owner
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  BedrockRegion:
    Type: String
    Default: ap-south-1
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
  MockBedrock:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  MockBedrockFixture:
    Type: String
    Default: auto
    AllowedValues:
      - auto
      - clean
      - plastic
      - low_confidence
      - malformed
      - hazard
  LocationRegion:
    Type: String
    Default: ap-south-1
  PlantLat:
    Type: Number
    Default: 12.681
  PlantLng:
    Type: Number
    Default: 77.474
  TargetKg:
    Type: Number
    Default: 1200
  TruckCapacityKg:
    Type: Number
    Default: 2000
  ShiftStart:
    Type: String
    Default: "06:00"
  ShiftEnd:
    Type: String
    Default: "11:00"
  ServiceMin:
    Type: Number
    Default: 10
  MaxRadiusKm:
    Type: Number
    Default: 15
  RoadFactor:
    Type: Number
    Default: 1.3
  FallbackSpeedKmph:
    Type: Number
    Default: 20
  StopAtTarget:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  MockLocation:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173

  OperationsTableName:
    Type: String
    Default: feedsure-dev-Operations
  PickupsTableName:
    Type: String
    Default: feedsure-dev-Pickups
  GateLogsTableName:
    Type: String
    Default: feedsure-dev-GateLogs
  MutationLogTableName:
    Type: String
    Default: feedsure-dev-MutationLog
  DriverTokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  CapacityBuffer:
    Type: Number
    Default: 0.10
  ReadinessPrior:
    Type: Number
    Default: 0.8
  ReadyCutoff:
    Type: String
    Default: "20:00"
  DriverTokenHours:
    Type: Number
    Default: 12
  GpsRetentionDays:
    Type: Number
    Default: 30
  GpsAccuracyM:
    Type: Number
    Default: 100
  GeofenceM:
    Type: Number
    Default: 150
  AbsoluteToleranceKg:
    Type: Number
    Default: 20
  PercentageTolerancePct:
    Type: Number
    Default: 5
  DedupRetentionDays:
    Type: Number
    Default: 7

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 29
    CodeUri: src/
    Environment:
      Variables:
        STAGE: !Ref Stage
        BEDROCK_REGION: !Ref BedrockRegion
        LOCATION_REGION: !Ref LocationRegion
        TZ_NAME: Asia/Kolkata
        GENERATORS_TABLE: !Ref GeneratorsTable
        HISTORY_TABLE: !Ref HistoryTable
        SUBMISSIONS_TABLE: !Ref SubmissionsTable
        PLANS_TABLE: !Ref PlansTable
        OPERATIONS_TABLE: !Ref OperationsTable
        PICKUPS_TABLE: !Ref PickupsTable
        GATE_LOGS_TABLE: !Ref GateLogsTable
        MUTATION_LOG_TABLE: !Ref MutationLogTable
        DRIVER_TOKEN_SECRET: !Ref DriverTokenSecret
        CAPACITY_BUFFER: !Ref CapacityBuffer
        READINESS_PRIOR: !Ref ReadinessPrior
        READY_CUTOFF: !Ref ReadyCutoff
        DRIVER_TOKEN_HOURS: !Ref DriverTokenHours
        GPS_RETENTION_DAYS: !Ref GpsRetentionDays
        GPS_ACCURACY_M: !Ref GpsAccuracyM
        GEOFENCE_M: !Ref GeofenceM
        ABSOLUTE_TOLERANCE_KG: !Ref AbsoluteToleranceKg
        PERCENTAGE_TOLERANCE_PCT: !Ref PercentageTolerancePct
        DEDUP_RETENTION_DAYS: !Ref DedupRetentionDays
        PHOTOS_BUCKET: !Ref PhotosBucket
        UPLOAD_MIN_BYTES: !Ref UploadMinBytes
        UPLOAD_MAX_BYTES: !Ref UploadMaxBytes
        UPLOAD_EXPIRY_SECONDS: !Ref UploadExpirySeconds
        PHOTO_RETENTION_DAYS: !Ref PhotoRetentionDays
        PHOTO_MAX_DIMENSION: !Ref PhotoMaxDimension
        PHOTO_MAX_PIXELS: !Ref PhotoMaxPixels
        PHOTO_MAX_DECODED_BYTES: !Ref PhotoMaxDecodedBytes
        BEDROCK_MAX_TOKENS: !Ref BedrockMaxTokens
        MIN_CONFIDENCE: !Ref PhotoMinConfidence
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MOCK_BEDROCK: !Ref MockBedrock
        MOCK_BEDROCK_FIXTURE: !Ref MockBedrockFixture
        ADMIN_TOKEN: !Ref AdminToken
        PLANT_OWNER_TOKEN: !Ref PlantOwnerToken
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        PLANT_LAT: !Ref PlantLat
        PLANT_LNG: !Ref PlantLng
        TARGET_KG: !Ref TargetKg
        TRUCK_CAPACITY_KG: !Ref TruckCapacityKg
        SHIFT_START: !Ref ShiftStart
        SHIFT_END: !Ref ShiftEnd
        SERVICE_MIN: !Ref ServiceMin
        MAX_RADIUS_KM: !Ref MaxRadiusKm
        ROAD_FACTOR: !Ref RoadFactor
        FALLBACK_SPEED_KMPH: !Ref FallbackSpeedKmph
        STOP_AT_TARGET: !Ref StopAtTarget
        MOCK_LOCATION: !Ref MockLocation

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Ref ApiName
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - content-type
          - x-admin-token
          - x-plant-token
          - x-generator-token
          - x-driver-token
          - idempotency-key
        AllowMethods:
          - GET
          - POST
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub feedsure-${Stage}-uploads
      Handler: feedsure.handlers.uploads.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GeneratorsTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${PhotosBucket.Arn}/submissions/*
      Events:
        CreateUploads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /uploads

  OperationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub feedsure-${Stage}-operations
      Handler: feedsure.handlers.operations.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan]
              Resource: !GetAtt GeneratorsTable.Arn
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt OperationsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt HistoryTable.Arn
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt SubmissionsTable.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub ${PhotosBucket.Arn}/submissions/*
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}
                - !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem]
              Resource:
                - !GetAtt OperationsTable.Arn
                - !GetAtt PlansTable.Arn
                - !GetAtt PickupsTable.Arn
                - !Sub ${PickupsTable.Arn}/index/byGenerator
                - !GetAtt GateLogsTable.Arn
                - !GetAtt MutationLogTable.Arn
            - Effect: Allow
              Action: geo-routes:CalculateRouteMatrix
              Resource: "*"
      Events:
        Route0:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /generators
        Route1:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /generators/{generatorId}
        Route2:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /operations
        Route3:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /submissions
        Route4:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /submissions
        Route5:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /submissions/{submissionId}/screen
        Route6:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /generators/{generatorId}/hazard-reviews
        Route7:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /generators/{generatorId}/receipts
        Route8:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /plans
        Route9:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /plans/{date}
        Route10:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /plans/{planKey}/details
        Route11:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /plans/{planKey}/dispatch
        Route12:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /plans/{planKey}/driver
        Route13:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /pickups
        Route14:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /gate-logs
        PlantIntake:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /intake
        AttachPhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /submissions/{submissionId}/photo
        ReadEvidence:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /submissions/{submissionId}/evidence
        KitchenReadiness:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /generators/{generatorId}/readiness

  GeneratorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref GeneratorsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: generatorId
          AttributeType: S
      KeySchema:
        - AttributeName: generatorId
          KeyType: HASH

  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref HistoryTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: generatorId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: generatorId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SubmissionsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: generatorId
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: generatorId
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byDate
          KeySchema:
            - AttributeName: date
              KeyType: HASH
            - AttributeName: ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PlansTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: planId
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: planId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  OperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref OperationsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: collectionDate
          AttributeType: S
        - AttributeName: recordKey
          AttributeType: S
      KeySchema:
        - AttributeName: collectionDate
          KeyType: HASH
        - AttributeName: recordKey
          KeyType: RANGE

  PickupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref PickupsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: planKey
          AttributeType: S
        - AttributeName: generatorId
          AttributeType: S
        - AttributeName: recordKey
          AttributeType: S
      KeySchema:
        - AttributeName: planKey
          KeyType: HASH
        - AttributeName: generatorId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byGenerator
          KeySchema:
            - AttributeName: generatorId
              KeyType: HASH
            - AttributeName: recordKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GateLogsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref GateLogsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: planId
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: planId
          KeyType: RANGE

  MutationLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref MutationLogTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scopeKey
          AttributeType: S
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: scopeKey
          KeyType: HASH
        - AttributeName: idempotencyKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref PhotosBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - POST
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: DeleteSubmissionsAfterRetention
            Prefix: submissions/
            Status: Enabled
            ExpirationInDays: !Ref PhotoRetentionDays

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTls
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PhotosBucket.Arn
              - !Sub ${PhotosBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  PhotosBucketName:
    Value: !Ref PhotosBucket
  GeneratorsTableName:
    Value: !Ref GeneratorsTable
  HistoryTableName:
    Value: !Ref HistoryTable
  SubmissionsTableName:
    Value: !Ref SubmissionsTable
  PlansTableName:
    Value: !Ref PlansTable
